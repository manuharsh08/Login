<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Settings</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>
<canvas id="snow"></canvas>

<main class="card dashboard-card">
  <div class="page-header">
    <div>
      <p class="eyebrow">Account</p>
      <h2>Profile Settings</h2>
      <p class="sub">Keep your learning profile current.</p>
    </div>
  </div>

  <img id="avatarPreview" class="avatar" alt="Profile picture preview" />

  <div class="form-stack">
    <label class="field" for="nameInput">
      <span>Name</span>
      <input id="nameInput" placeholder="Your name" autocomplete="name" />
    </label>

    <label class="field" for="fileInput">
      <span>Profile Picture</span>
      <input id="fileInput" type="file" accept="image/*" />
    </label>
  </div>

  <div class="actions">
    <button id="saveBtn" type="button">Save Changes</button>
    <button id="backBtn" type="button" class="secondary">Back to Dashboard</button>
  </div>
</main>

<script type="module" src="js/profileSettings.js"></script>
<script type="module" src="js/snow.js"></script>
</body>
</html>
