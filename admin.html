<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <link rel="stylesheet" href="./css/style.css"/>
  <link rel="icon" href="favicon.ico" />
</head>
<body>
<canvas id="snow"></canvas>

<main class="card dashboard-card">
  <div class="page-header">
    <div>
      <p class="eyebrow">Admin</p>
      <h1>Admin Dashboard</h1>
      <p class="sub">Manage tests and monitor student performance.</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <h2 id="totalTests">0</h2>
      <p>Total Tests</p>
    </div>

    <div class="stat-box">
      <h2 id="totalAttempts">0</h2>
      <p>Attempts</p>
    </div>

    <div class="stat-box">
      <h2 id="avgScore">0%</h2>
      <p>Avg Score</p>
    </div>
  </div>

  <div class="section">
    <h3>Create Test</h3>

    <div class="form-stack">
      <label class="field" for="testTitle">
        <span>Test Title</span>
        <input id="testTitle" type="text" placeholder="Unit 1 Assessment" />
      </label>
      <label class="field" for="testSubject">
        <span>Subject</span>
        <input id="testSubject" type="text" placeholder="Mathematics" />
      </label>
      <label class="field" for="testLink">
        <span>Google Form Link</span>
        <input id="testLink" type="url" placeholder="https://forms.gle/..." />
      </label>
    </div>

    <button id="addTestBtn" type="button">Add Test</button>
  </div>

  <div class="section">
    <div class="section-title">
      <h3>All Tests</h3>
      <span id="adminTestsCount">0 tests</span>
    </div>
    <div id="adminTestsList"></div>
  </div>

  <div class="section">
    <div class="section-title">
      <h3>Student Results</h3>
      <span id="adminResultsCount">0 results</span>
    </div>
    <div id="adminResultsList"></div>
  </div>

  <button id="logoutBtn" type="button" class="secondary">Logout</button>
</main>

<footer class="credits-bar">
  2026 Made by <span class="author">Harshvardhan Dhankhar</span>
</footer>

<script type="module" src="./js/admin.js"></script>
<script type="module" src="./js/snow.js"></script>
</body>
</html>
